# Назначение: направить pip только на внутренний индекс.
# Статус: ПРОВЕРЕНО (pip 23+). Механику выбора версии среди индексов — проверить командой ниже.
# Версии инструментов: pip 23+.
# Пункты CHECKLIST.md: 10, 15.
#
# (а) Что проверяем: уходят ли запросы на публичный PyPI и откуда берётся архив.
# (б) pip install -vv --index-url {{PYPI_INDEX_URL}} <имя-пакета> 2>&1 | grep -E 'Looking in|Downloading'
# (в) Ожидаем: единственный индекс — {{PYPI_INDEX_URL}}; архив не с files.pythonhosted.org.
#     Добавление extra-index-url делает видимыми оба индекса, и pip выбирает лучшую
#     версию среди всех найденных, включая публичный, — этого достаточно для dependency confusion.
# (г) https://pip.pypa.io/en/stable/cli/pip_install/#cmdoption-index-url
#     https://pip.pypa.io/en/stable/topics/secure-installs/

[global]
index-url = {{PYPI_INDEX_URL}}
# extra-index-url НЕ добавлять: он превращает гейт в рекомендацию.
# trusted-host добавлять только при HTTP или внутреннем CA, после проверки
# `pip config list` и `pip install -vv` в вашей среде.
