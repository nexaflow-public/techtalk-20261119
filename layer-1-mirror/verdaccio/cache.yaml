# Назначение: типичный pull-through кеш npm — то, как делают все.
# Статус: ПРОВЕРЕНО (синтаксис Verdaccio 5.x). Поведение в вашей среде — проверить командой ниже.
# Версии инструментов: Verdaccio 5.x.
# Пункты CHECKLIST.md: 7.
#
# Это кеш, а не гейт. Catch-all '**' с proxy на upstream означает: любой запрос,
# включая выдуманное моделью имя пакета, уходит на публичный реестр и резолвится,
# если там есть совпадение. Правила матчатся сверху вниз, применяется первое
# совпавшее; '**' стоит последним и ловит всё остальное.
#
# Проверка (а/б/в/г):
#   (а) что проверяем: уходит ли неизвестный пакет на публичный upstream;
#   (б) npm view пакет-выдуманное-имя --registry=http://localhost:4873 --loglevel=http
#   (в) ожидаем: в логе виден запрос к registry.npmjs.org; ответ 200 при совпадении;
#       отсутствие гейта и есть проблема, которую решает gate.yaml.
#   (г) https://verdaccio.org/docs/configuration/#uplinks и /#packages

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true

packages:
  '@*/*':
    access: $all
    proxy: npmjs
  '**':
    access: $all
    proxy: npmjs
